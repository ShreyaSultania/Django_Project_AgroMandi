version: '3.9'

services:
  frontend:
    build:
      context: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./django_backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - MONGO_URI=${MONGO_URI:-}
      - OPENCAGE_API_KEY=${OPENCAGE_API_KEY:-}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY:-}
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: agro_redis_cache
    restart: always
    ports:
      - "6379:6379"
